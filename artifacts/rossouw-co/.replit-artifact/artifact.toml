kind = "web"
previewPath = "/"
title = "Rossouw & Co."
description = "A responsive, search-optimized website for Rossouw & Co., a Cape Town motorcycle business offering bike sales, fleet deals, repairs, and fleet maintenance."
version = "1.0.0"
id = "artifacts/rossouw-co"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19142

[services.development]
run = "pnpm --filter @workspace/rossouw-co run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rossouw-co", "run", "build" ]
serve = "static"
publicDir = "artifacts/rossouw-co/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19142"
BASE_PATH = "/"
